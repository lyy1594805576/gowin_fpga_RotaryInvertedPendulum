name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rtl-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog xvfb python3-tk
          python -m pip install -r requirements.txt
      - name: Compile and test without hardware
        run: xvfb-run -a python sim/run_tests.py --host-tests
